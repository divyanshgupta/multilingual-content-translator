[project]
name = "rag-project"
version = "0.1.0"
description = "RAG project with multi-agent multilingual translator for Agoda whitelabel travel sites"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chromadb>=1.5.9",
    "deep-translator>=1.11.4",
    "faiss-cpu>=1.13.2",
    "ipykernel>=7.2.0",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.2.2",
    "langchain-xai>=1.2.2",
    "langgraph>=1.2.1",
    "pypdf>=6.12.1",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.42.0",
    "tiktoken>=0.13.0",
]

[project.scripts]
translate = "main:main"
