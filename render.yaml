services:
  - type: web
    name: multilingual-content-translator
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-deploy.txt && pip install --no-deps -e .
    startCommand: streamlit run streamlit_app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: PYTHONPATH
        value: /opt/render/project/src
